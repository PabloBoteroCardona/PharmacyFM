# Puerto: usa la variable de entorno PORT si existe (Railway), o 8080 localmente
server.port=${PORT:8080}

# Cloud Run (y Railway) terminan HTTPS en su proxy y reenvían HTTP plano al contenedor.
# Sin esto, Spring no sabe que la petición original llegó por HTTPS y genera
# redirects/URLs con esquema http:// — el navegador los bloquea como mixed content.
server.forward-headers-strategy=framework

spring.application.name=PharmacyFM API

# Excluir auto-configuración de DataSource de Spring Boot:
# la infraestructura JDBC propia gestiona las conexiones a SQLite
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Swagger UI disponible en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
